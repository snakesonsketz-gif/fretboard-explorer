# Builds the Fretlab Android app (APK) on every push to main and publishes it at a fixed link:
#   https://github.com/snakesonsketz-gif/fretboard-explorer/releases/download/android-latest/Fretlab.apk
# Testers install it once; later builds install over the top (same tester signing key, rising version).
name: Android app

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  TAG: android-latest
  GH_TOKEN: ${{ github.token }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Make sure the release exists
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Fretlab for Android (test build)" --notes "First build in progress…"

      - name: Install web app dependencies
        run: |
          # Lovable pins one package to its private registry; CI fetches the same version from public npm.
          sed -i 's#"https://[a-z0-9-]*-npm\.pkg\.dev/[^"]*"#""#g' bun.lock
          bun install

      - name: Tests
        run: bun run test

      - name: Build the web app (static)
        run: bun run build:mobile

      - name: Copy it into the Android project
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android

      - name: Build the APK
        working-directory: mobile/android
        env:
          FRETLAB_BUILD: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"

      - name: Publish Fretlab.apk
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk Fretlab.apk
          gh release upload "$TAG" Fretlab.apk --clobber
          gh release delete-asset "$TAG" build-log.txt -y 2>/dev/null || true
          gh release edit "$TAG" --title "Fretlab for Android — build ${{ github.run_number }}" --notes "$(cat <<NOTES
          **Download:** [Fretlab.apk](https://github.com/${{ github.repository }}/releases/download/$TAG/Fretlab.apk)

          Build ${{ github.run_number }} (version 1.0.${{ github.run_number }}) from commit ${GITHUB_SHA::7}, $(date -u '+%Y-%m-%d %H:%M UTC').

          **Install:** open the link on an Android phone → download → tap the file → allow "install unknown apps" for your browser if asked → Install.
          Updates install over the old one. First time Listen is used, Android asks for the microphone.

          Test build signed with a shared test key — not a store release.
          NOTES
          )"

      - name: Publish the build log if something failed
        if: failure()
        run: |
          [ -f build-log.txt ] || echo "Failed before the Gradle step — see the Actions tab for the step that failed." > build-log.txt
          gh release upload "$TAG" build-log.txt --clobber || true
